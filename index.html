<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gather — Event Management</title>
<style>
:root{--navy:#122331;--navy2:#1c3040;--teal:#138879;--mint:#dff4ee;--ink:#17232d;--muted:#71808a;--line:#e6ebee;--bg:#f5f7f7;--amber:#f1b34e;--red:#c75b54;--white:#fff;--shadow:0 10px 30px #142b3910}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--navy);color:#d9e2e7;padding:25px 16px;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:10px;color:white;font-size:21px;font-weight:750;padding:0 8px 32px}.brandmark{height:32px;width:32px;background:#4ed0b7;color:var(--navy);display:grid;place-items:center;border-radius:10px;font-weight:900}.navlabel{font-size:10px;letter-spacing:1.4px;color:#8095a3;padding:12px 12px 8px}.nav button{width:100%;border:0;background:transparent;color:#b8c6ce;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#2a4050;color:#fff}.nav .ico{width:18px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;border-top:1px solid #344957;padding:16px 8px 0;color:#b8c6ce}.profile{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#d4eee7;color:#126e62;display:grid;place-items:center;font-weight:750}.profile small{display:block;color:#8ea1ac}.main{margin-left:238px;min-height:100vh}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:4}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:18px}.role-switch{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px;color:#40515c}.content{padding:30px 36px 60px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.eyebrow{color:var(--teal);font-weight:750;text-transform:uppercase;font-size:10px;letter-spacing:1.5px}.pagehead h1{font-size:29px;letter-spacing:-.8px;margin:4px 0 5px}.sub{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 15px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#a9c9c2}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.soft{background:var(--mint);border-color:var(--mint);color:#126e62}.btn.danger{color:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow)}.statlabel{font-size:12px;color:var(--muted)}.statnum{font-size:27px;font-weight:750;letter-spacing:-1px;margin:8px 0 3px}.statfoot{font-size:11px;color:var(--muted)}.positive{color:var(--teal)}.two{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.cardhead h3{font-size:15px;margin:0}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0f2f3;font-size:13px}tr:last-child td{border-bottom:0}.pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:20px;background:#edf6f3;color:#147766;display:inline-block}.pill.amber{background:#fff4df;color:#98630d}.pill.red{background:#fdecea;color:#a9433c}.pill.gray{background:#edf0f2;color:#63717a}.checkrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f3;align-items:center}.checkrow:last-child{border:0}.checkrow input{accent-color:var(--teal);width:16px;height:16px}.progress{height:8px;background:#eaf0f1;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#38bba6;border-radius:9px}.alert{padding:14px 16px;background:#fff4df;border:1px solid #f2d69d;border-radius:11px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:19px}.eventhero{background:var(--navy);color:#fff;border-radius:16px;padding:28px;position:relative;overflow:hidden;min-height:190px}.eventhero:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff22;border-radius:50%;right:5%;top:-90px;box-shadow:0 0 0 35px #ffffff09,0 0 0 70px #ffffff06}.eventhero h2{font-size:30px;margin:10px 0}.eventhero p{color:#c2d0d8;margin:0}.eventmeta{display:flex;gap:24px;flex-wrap:wrap;color:#d2dce2;margin-top:18px;font-size:12px}.featuregrid{grid-template-columns:repeat(3,1fr);margin-top:20px}.feature{padding:17px;border:1px solid var(--line);border-radius:11px}.feature b{display:block;margin:5px 0}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:17px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;flex:1}.field label{font-size:12px;color:#52616a;font-weight:650}.field input,.field select,.field textarea,.search{border:1px solid #dfe6e8;border-radius:8px;padding:11px 12px;background:#fff;outline:none;color:var(--ink);width:100%}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--teal);box-shadow:0 0 0 3px #13887918}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:span 2}.eventlist{grid-template-columns:repeat(3,minmax(0,1fr))}.eventcard{padding:0;overflow:hidden}.eventart{height:125px;background:linear-gradient(135deg,#173345,#167d78);position:relative;padding:17px;color:white}.eventart:after{content:"";position:absolute;right:20px;top:12px;width:95px;height:95px;border:1px solid #ffffff55;border-radius:50%;box-shadow:0 0 0 16px #ffffff12,0 0 0 32px #ffffff0b}.eventart.orange{background:linear-gradient(135deg,#583c2b,#d28c43)}.eventart.purple{background:linear-gradient(135deg,#332d54,#8374a9)}.eventbody{padding:16px}.eventbody h3{margin:9px 0 5px;font-size:16px}.eventfoot{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.timeline{display:grid;grid-template-columns:65px repeat(3,1fr);gap:9px}.time{color:var(--muted);font-size:12px;padding:14px 0;border-top:1px solid var(--line)}.session{padding:12px;border-radius:9px;background:#e8f5f1;border-left:3px solid var(--teal);margin:5px 0}.session.conflict{background:#fff2dc;border-color:var(--amber)}.session b{display:block;font-size:12px}.session small{color:var(--muted)}.ticket{max-width:460px;margin:auto;border:1px dashed #b8c9c7;border-radius:16px;padding:25px;text-align:center}.qr{width:150px;height:150px;margin:18px auto;background:repeating-conic-gradient(#172b38 0% 25%,#fff 0% 50%) 50%/14px 14px;border:9px solid white;outline:1px solid #dfe6e8}.modalback{position:fixed;inset:0;background:#0d1d28a8;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{background:#fff;border-radius:15px;width:min(600px,100%);max-height:90vh;overflow:auto;padding:23px;box-shadow:0 24px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:20px}.x{border:0;background:#f0f3f4;border-radius:8px;width:32px;height:32px}.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:white;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:30;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.empty{padding:35px;text-align:center;color:var(--muted)}.mobilemenu{display:none}
@media(max-width:1050px){.sidebar{width:205px}.main{margin-left:205px}.stats{grid-template-columns:repeat(2,1fr)}.eventlist{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.2s;width:245px}.sidebar.open{transform:none}.main{margin-left:0}.topbar{padding:0 16px}.content{padding:22px 16px}.mobilemenu{display:inline-flex}.pagehead{flex-direction:column}.stats,.two,.three,.featuregrid,.eventlist{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.topright{gap:8px}.role-switch{max-width:135px}.timeline{grid-template-columns:45px repeat(3,minmax(100px,1fr));overflow:auto}.card{padding:15px}}
</style></head>
<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">G</span> Gather</div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
<button data-page="overview" class="active"><span class="ico">▦</span>Overview</button><button data-page="events"><span class="ico">▣</span>Events</button><button data-page="registrations"><span class="ico">♙</span>Registrations</button><button data-page="schedule"><span class="ico">▤</span>Schedule</button><button data-page="venues"><span class="ico">⌖</span>Venues</button><button data-page="vendors"><span class="ico">♧</span>Vendors</button><button data-page="payments"><span class="ico">৳</span>Payments & budget</button><button data-page="messages"><span class="ico">✉</span>Messages</button><button data-page="reports"><span class="ico">▥</span>Reports</button>
<div class="navlabel">PERSONAL</div><button data-page="tickets"><span class="ico">▧</span>My tickets</button><button data-page="checkin"><span class="ico">⌗</span>Event check-in</button><button data-page="admin"><span class="ico">⚙</span>Admin panel</button></nav><div class="sidebottom"><div class="profile"><div class="avatar">AR</div><div><b>Alex Rahman</b><small>Event organizer</small></div></div></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menuBtn">☰</button><span class="crumb">Workspace / <b id="crumb">Overview</b></span></div><div class="topright"><span class="muted">⌕</span><button class="btn" onclick="toast('You are all caught up!')">♧ <span>Notifications</span></button><select class="role-switch" id="roleSwitch" aria-label="Preview role"><option>Organizer view</option><option>Participant view</option><option>Vendor view</option><option>Check-in staff</option><option>Administrator</option></select></div></header><section class="content" id="view"></section></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Create event</h2><button class="x" onclick="closeModal()">✕</button></div><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
<script>
const state={page:'overview',events:[{name:'Tech Fest 2026',category:'Conference',date:'15 Oct 2026',venue:'Main Auditorium',status:'Published',capacity:500,registered:412,price:15},{name:'Design Week',category:'Workshop',date:'22 Oct 2026',venue:'Innovation Hub',status:'Published',capacity:180,registered:126,price:8},{name:'Campus Cultural Night',category:'Cultural',date:'02 Nov 2026',venue:'Open Air Stage',status:'Draft',capacity:700,registered:0,price:0}],registrations:[['Ayesha Rahman','General','Paid','Today, 10:42'],['Tanvir Hasan','Student','Paid','Today, 09:15'],['Nusrat Jahan','General','Pending','Yesterday'],['Rafiq Ahmed','Speaker','Free','Yesterday']],vendors:[['CaterPro','Catering','৳45,000','Booked'],['StageCraft','Stage & decor','৳32,000','Booked'],['SoundWave AV','Audio & video','৳18,000','Pending']],expenses:[['Venue booking','৳35,000','Confirmed'],['Catering','৳45,000','Booked'],['Stage & decor','৳32,000','Booked']],announcements:[],checks:0};
const pages={overview:'Overview',events:'Events',registrations:'Registrations',schedule:'Schedule',venues:'Venues',vendors:'Vendors',payments:'Payments & budget',messages:'Messages',reports:'Reports',tickets:'My tickets',checkin:'Event check-in',admin:'Admin panel'};
function go(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=pages[p];render();document.getElementById('sidebar').classList.remove('open')}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('roleSwitch').onchange=e=>{const v=e.target.value;if(v==='Participant view')go('tickets');else if(v==='Vendor view')go('vendors');else if(v==='Check-in staff')go('checkin');else if(v==='Administrator')go('admin');else go('overview')};
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),2600)}
function openModal(title,html,after){document.getElementById('modalTitle').textContent=title;document.getElementById('modalContent').innerHTML=html;document.getElementById('modalback').classList.add('show');if(after)after()}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function head(k,title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function btn(label,fn,kind=''){return `<button class="btn ${kind}" onclick="${fn}">${label}</button>`}
function stat(label,num,foot){return `<div class="card"><div class="statlabel">${label}</div><div class="statnum">${num}</div><div class="statfoot">${foot}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function badge(s){let c=s==='Paid'||s==='Published'||s==='Booked'||s==='Confirmed'?'':s==='Pending'||s==='Draft'||s==='Requested'?'amber':s==='Cancelled'||s==='Rejected'?'red':'gray';return `<span class="pill ${c}">${s}</span>`}
function render(){const v=document.getElementById('view');const p=state.page;let html='';
if(p==='overview'){html=head('ORGANIZER DASHBOARD','Tech Fest 2026','Here’s what’s happening with your event.',btn('Preview event page',"go('public')")+btn('+ Create event',"createEvent()",'primary'));html+=`<div class="eventhero"><span class="pill" style="background:#f4b64d;color:#3e2b0e">Conference</span><h2>Tech Fest 2026</h2><p>15 October 2026 · 9:00 AM – 5:00 PM · Main Auditorium, University Campus</p><div class="eventmeta"><span>◉ Hosted by Computer Science Club</span><span>◷ 12 days to go</span><span>♙ 412 / 500 registrations</span></div></div><div class="grid stats" style="margin-top:18px">${stat('Registered','412','82% of 500 seats')}${stat('Payments received','৳6,180','38 pending')}${stat('Budget used','64%','৳2,900 left')}${stat('Days to go','12','Starts 15 Oct, 9:00 AM')}</div><div class="alert"><div><b>⚠ One schedule conflict detected</b><div class="muted">Workshop B and the Industry Keynote overlap in Hall 2 at 11:00 AM.</div></div>${btn('Resolve conflict',"go('schedule')",'dark')}</div><div class="grid two"><div class="card"><div class="cardhead"><h3>Recent registrations</h3>${btn('View all',"go('registrations')")}</div>${table(['Participant','Ticket','Payment',''],state.registrations.slice(0,4).map(r=>[r[0],r[1],badge(r[2]),`<span class="muted">${r[3]}</span>`]))}</div><div class="card"><div class="cardhead"><h3>Setup checklist</h3><span class="muted">3 of 6 complete</span></div>${['Venue confirmed','Registration open','Catering booked','Confirm AV vendor','Send reminder to speakers','Print name badges'].map((x,i)=>`<label class="checkrow"><input type="checkbox" ${i<3?'checked':''} onchange="toast('Checklist updated')"><span>${x}</span></label>`).join('')}</div></div>`}
if(p==='events'){html=head('YOUR WORKSPACE','Events','Create, publish and manage all your events.',btn('+ Create event','createEvent()','primary'));html+=`<div class="toolbar"><input class="search" id="eventSearch" placeholder="Search events by name…" oninput="filterEvents()" style="max-width:310px"><select class="search" id="eventFilter" onchange="filterEvents()" style="max-width:180px"><option value="All">All statuses</option><option>Published</option><option>Draft</option></select><span class="muted">${state.events.length} events</span></div><div class="grid eventlist" id="eventCards">${eventCards(state.events)}</div>`}
if(p==='registrations'){html=head('ATTENDEES','Registrations & guest list','Manage ticket holders, payments and attendance.',btn('＋ Add guest','addGuest()','primary')+btn('↓ Export CSV',"toast('CSV export prepared for this demo')"));html+=`<div class="grid stats">${stat('Total registrations','412','Across all ticket types')}${stat('Confirmed','374','90.8% of registrations')}${stat('Pending payment','38','Follow-up required')}${stat('Waitlist','12','Seats currently full')}</div><div class="card"><div class="toolbar"><input class="search" placeholder="Search attendee…" oninput="filterTable(this)" style="max-width:280px"><select class="search" style="max-width:160px"><option>All ticket types</option><option>General</option><option>Student</option><option>Speaker</option></select><select class="search" style="max-width:150px"><option>All payments</option><option>Paid</option><option>Pending</option></select></div><div id="regTable">${table(['Participant','Ticket type','Payment','Registered','Actions'],state.registrations.map(r=>[r[0],r[1],badge(r[2]),r[3],btn('View',`toast('Viewing ${r[0]}')`)]))}</div></div>`}
if(p==='schedule'){html=head('EVENT PLANNING','Schedule builder','Build your agenda and catch room or speaker conflicts before event day.',btn('+ Add session','addSession()','primary'));html+=`<div class="alert"><div><b>⚠ Hall 2 is double-booked at 11:00 AM</b><div class="muted">Workshop B overlaps with the Industry Keynote. Move one session to another room or time.</div></div>${btn('Move Workshop B',"resolveConflict()",'dark')}</div><div class="card"><div class="cardhead"><h3>15 October · Event day agenda</h3><span class="pill">3 rooms</span></div><div class="timeline"><div></div><b>Hall 1</b><b>Hall 2</b><b>Hall 3</b><div class="time">09:00</div><div class="session"><b>Check-in</b><small>09:00 – 10:00</small></div><div></div><div></div><div class="time">10:00</div><div class="session"><b>Opening keynote</b><small>10:00 – 11:30</small></div><div></div><div></div><div class="time">11:00</div><div></div><div class="session conflict" id="workshop"><b>Workshop B · Conflict</b><small>11:00 – 12:30 · Room overlap</small></div><div class="session"><b>Workshop A</b><small>11:30 – 13:00</small></div><div class="time">11:00</div><div></div><div class="session conflict"><b>Industry keynote</b><small>11:00 – 12:00 · Room overlap</small></div><div></div><div class="time">13:00</div><div class="session"><b>Networking lunch</b><small>13:00 – 14:00 · Courtyard</small></div><div></div><div></div></div></div>`}
if(p==='venues'){html=head('EVENT LOGISTICS','Venue booking','Find spaces by capacity, location, facilities, price and availability.',btn('＋ Add venue','addVenue()','primary'));html+=`<div class="grid three">${[['Main Auditorium','500 seats','৳35,000 / day','Confirmed','Projector · Sound · AC'],['Seminar rooms','80 seats each','৳12,000 / day','Confirmed','Projector · AC'],['Open Courtyard','300 seats','৳18,000 / day','Available','Outdoor · Power']].map((a,i)=>`<div class="card"><div class="eventart ${i===1?'purple':i===2?'orange':''}" style="height:95px"><span class="pill">${a[3]}</span></div><h3>${a[0]}</h3><p class="muted">${a[1]} · ${a[4]}</p><b>${a[2]}</b><div style="margin-top:15px">${btn(i===2?'Check availability':'View booking',`toast('${a[0]} · ${a[3]}')`,'soft')}</div></div>`).join('')}</div><div class="card" style="margin-top:18px"><div class="cardhead"><h3>Current venue bookings</h3><span class="muted">Tech Fest 2026</span></div>${table(['Venue','Date','Time','Capacity','Status'],[['Main Auditorium','15 Oct 2026','09:00 – 17:00','500',badge('Confirmed')],['Seminar rooms','15 Oct 2026','10:00 – 15:00','160',badge('Confirmed')],['Open Courtyard','15 Oct 2026','13:00 – 14:00','300',badge('Requested')]])}</div>`}
if(p==='vendors'){html=head('EVENT PARTNERS','Vendor marketplace','Request quotes, compare services and track vendor commitments.',btn('＋ Find vendors','addVendor()','primary'));html+=`<div class="grid stats">${stat('Assigned vendors','4','For Tech Fest 2026')}${stat('Quotes received','6','2 awaiting review')}${stat('Committed spend','৳95,000','Across 3 booked services')}${stat('Pending tasks','1','Awaiting AV confirmation')}</div><div class="card">${table(['Vendor','Service','Agreed price','Status','Action'],state.vendors.map(r=>[r[0],r[1],r[2],badge(r[3]),btn('Details',`toast('Vendor: ${r[0]}')`)]))}</div>`}
if(p==='payments'){html=head('FINANCE','Payments & budget','Track ticket revenue, payment status and event expenses.',btn('＋ Add expense','addExpense()','primary')+btn('↓ Export report',"toast('Budget report exported')"));html+=`<div class="grid stats">${stat('Ticket revenue','৳6,180','374 successful payments')}${stat('Total budget','৳8,000','Set for this event')}${stat('Spent / committed','৳5,100','64% of total budget')}${stat('Remaining','৳2,900','36% available')}</div><div class="grid two"><div class="card"><div class="cardhead"><h3>Budget utilization</h3><b>64%</b></div><div class="progress"><span style="width:64%"></span></div><p class="muted" style="margin-top:10px">৳5,100 used of ৳8,000 planned budget</p><div style="margin-top:22px">${table(['Expense','Amount','Status'],state.expenses.map(r=>[r[0],r[1],badge(r[2])]))}</div></div><div class="card"><h3 style="margin-top:0">Payment summary</h3><div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)"><span class="muted">Successful</span><b>৳6,180</b></div><div style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)"><span class="muted">Pending</span><b>৳570</b></div><div style="display:flex;justify-content:space-between;padding:14px 0"><span class="muted">Refunded</span><b>৳0</b></div></div></div>`}
if(p==='messages'){html=head('COMMUNICATION','Announcements & messages','Send updates to all participants or selected ticket groups.');html+=`<div class="grid two"><div class="card"><h3 style="margin-top:0">Compose announcement</h3><div class="field"><label>Audience</label><select id="audience"><option>All confirmed participants</option><option>General ticket holders</option><option>Student ticket holders</option><option>Speakers</option><option>Waitlist</option></select></div><div class="field"><label>Subject</label><input id="msgSubject" placeholder="e.g. Important schedule update"></div><div class="field"><label>Message</label><textarea id="msgBody" placeholder="Write your announcement…"></textarea></div>${btn('Send announcement','sendMessage()','primary')} <span class="muted" style="font-size:11px">Demo only — no email or SMS is sent.</span></div><div class="card"><h3 style="margin-top:0">Recent announcements</h3><div id="messagesList">${state.announcements.length?state.announcements.map(a=>`<div class="checkrow"><div><b>${a.subject}</b><div class="muted">${a.audience} · Just now</div><p>${a.body}</p></div></div>`).join(''):'<div class="empty">No announcements yet. Your sent messages will appear here.</div>'}</div></div></div>`}
if(p==='reports'){html=head('ANALYTICS','Event reports','A snapshot of registrations, revenue, attendance and budget.',btn('↓ Export CSV','toast(\'CSV report prepared\')')+btn('↓ Export PDF','toast(\'PDF report prepared\')','primary'));html+=`<div class="grid stats">${stat('Registrations','412','+18% this week')}${stat('Revenue','৳6,180','From paid tickets')}${stat('Attendance','—','Available after check-in')}${stat('Budget utilization','64%','৳2,900 remaining')}</div><div class="grid two"><div class="card"><h3 style="margin-top:0">Registration trend</h3><div style="height:190px;display:flex;align-items:end;gap:12px;padding:20px 5px 0;border-bottom:1px solid var(--line)">${[28,42,36,58,49,72,64,88,76,100,84,92].map((n,i)=>`<div style="flex:1;background:linear-gradient(#35bca7,#168879);height:${n}%;border-radius:5px 5px 0 0;position:relative" title="${n} registrations"></div>`).join('')}</div><div class="muted" style="display:flex;justify-content:space-between;margin-top:9px;font-size:11px"><span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4</span></div></div><div class="card"><h3 style="margin-top:0">Ticket distribution</h3>${[['General',58],['Student',29],['Speaker',13]].map(x=>`<p style="display:flex;justify-content:space-between"><b>${x[0]}</b><span>${x[1]}%</span></p><div class="progress"><span style="width:${x[1]}%"></span></div>`).join('')}</div></div>`}
if(p==='tickets'){html=head('PARTICIPANT PORTAL','My tickets','Your registrations, e-tickets and event updates.',btn('Browse events',"go('public')",'primary'));html+=`<div class="card"><div class="cardhead"><div><span class="pill">Confirmed</span><h2 style="margin:9px 0 2px">Tech Fest 2026</h2><span class="muted">15 October 2026 · Main Auditorium</span></div>${btn('View schedule',"go('public')")}</div><div class="grid two"><div><div class="ticket"><div class="eyebrow">GATHER · E-TICKET</div><h2 style="margin:8px">Tech Fest 2026</h2><p class="muted">Alex Rahman · General admission</p><div class="qr"></div><b>GT-2026-8F2A91</b><p class="muted">Show this QR code at the entrance</p></div></div><div><h3>Event updates</h3><div class="alert" style="align-items:flex-start"><div><b>Registration confirmed</b><p class="muted" style="margin:4px 0 0">Your ticket is ready. Keep your QR code available at check-in.</p></div></div><div class="alert" style="background:#edf6f3;border-color:#cde8df"><div><b>Schedule update</b><p class="muted" style="margin:4px 0 0">Workshop B moves to Hall 3 at 1:30 PM.</p></div></div><p class="muted">A confirmation email and SMS would be sent by the connected services.</p></div></div></div>`}
if(p==='checkin'){html=head('EVENT DAY','Attendee check-in','Scan a ticket QR code or search by attendee name / ticket ID.');html+=`<div class="grid two"><div class="card"><h3 style="margin-top:0">Check-in desk</h3><div style="height:210px;background:#f0f5f4;border:1px dashed #a9c7c0;border-radius:12px;display:grid;place-items:center;text-align:center"><div><div style="font-size:42px">▦</div><b>QR scanner preview</b><p class="muted">Camera access is not connected in this demo.</p></div></div><div class="field" style="margin-top:16px"><label>Search ticket ID or attendee</label><input id="checkQuery" placeholder="e.g. Ayesha Rahman or GT-2026-8F2A91"></div>${btn('Search attendee','searchCheckin()','primary')}<div id="checkResult"></div></div><div class="card"><h3 style="margin-top:0">Live check-in summary</h3><div class="statnum" id="checkCount">${state.checks}</div><p class="muted">Checked in during this demo session</p><div class="progress"><span style="width:${Math.min(100,state.checks/412*100)}%"></span></div><p class="muted">Expected attendees: 412</p></div></div>`}
if(p==='admin'){html=head('SYSTEM ADMINISTRATION','Admin panel','Moderate events, approve accounts and maintain platform records.');html+=`<div class="grid stats">${stat('Pending approvals','5','3 organizers · 2 vendors')}${stat('Published events','28','Across all categories')}${stat('Active users','1,284','Organizer, participant & vendor')}${stat('Audit events','96','Last 7 days')}</div><div class="grid two"><div class="card"><div class="cardhead"><h3>Account approvals</h3><span class="pill amber">5 pending</span></div>${table(['Account','Role','Submitted','Action'],[['Creative Caterers','Vendor','Today',btn('Approve',"approve(this)",'soft')],['Campus Events Team','Organizer','Yesterday',btn('Approve',"approve(this)",'soft')],['Pixel Stage Co.','Vendor','Yesterday',btn('Review',"toast('Opening vendor application')")]])}</div><div class="card"><h3 style="margin-top:0">Recent audit log</h3>${[['Payment recorded','Tech Fest 2026','10:42 AM'],['Venue booking confirmed','Main Auditorium','09:30 AM'],['Organizer account approved','Campus Events','Yesterday']].map(a=>`<div class="checkrow"><div><b>${a[0]}</b><div class="muted">${a[1]} · ${a[2]}</div></div></div>`).join('')}</div></div>`}
if(p==='public'){html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px"><div class="brand" style="color:var(--navy);padding:0"><span class="brandmark">G</span> Gather</div><div class="actions">${btn('Log in',"toast('Login screen is represented in this demo')")}${btn('Start organizing',"go('overview')",'primary')}</div></div><div class="grid two" style="align-items:center;gap:30px;margin:40px 0 55px"><div><div class="eyebrow">EVENT MANAGEMENT SYSTEM</div><h1 style="font-size:clamp(40px,5vw,65px);line-height:1.05;letter-spacing:-2px;margin:12px 0 18px">Every part of your event, in one place.</h1><p class="sub" style="font-size:16px;max-width:470px">Registration, venues, schedules, vendors, payments and messages — organized together, so nothing gets lost and nothing clashes.</p><div class="actions" style="margin-top:25px">${btn('Start organizing',"go('overview')",'primary')}${btn('Find an event',"document.getElementById('browseEvents').scrollIntoView()")}</div></div><div class="eventhero" style="min-height:290px;display:flex;flex-direction:column;justify-content:center"><span class="pill" style="background:#f4b64d;color:#3e2b0e;width:max-content">12 days left</span><h2>Tech Fest 2026</h2><p>Registrations · 412 / 500</p><div class="progress" style="margin-top:12px"><span style="width:82%"></span></div><div class="alert" style="margin-top:22px;color:var(--ink);font-size:12px"><b>⚠ Schedule conflict caught</b><span>Workshop B · Hall 2</span></div></div></div><div class="eyebrow">WHAT IT DOES</div><h1 style="font-size:34px;margin:8px 0 20px">One platform for organizers, participants and partners.</h1><div class="grid featuregrid">${[['♙','Registration & guest lists','Simple sign-up forms, instant confirmations and a searchable guest list.'],['⌖','Venue booking','Compare spaces, check availability and avoid double-booking.'],['▤','Accurate schedules','Build a timeline across rooms and flag conflicts early.'],['♧','Vendor management','Keep caterers, decorators and AV teams in one place.'],['৳','Secure payments','Collect ticket fees and track budgets securely.'],['✉','Timely notifications','Send reminders and last-minute changes to participants.']].map(a=>`<div class="feature"><span style="font-size:21px;color:var(--teal)">${a[0]}</span><b>${a[1]}</b><span class="muted">${a[2]}</span></div>`).join('')}</div><div id="browseEvents" style="margin-top:55px">${head('DISCOVER','Find your next event','Browse events and register in a few simple steps.')}</div><div class="grid eventlist">${eventCards(state.events.filter(e=>e.status==='Published'))}</div>`}
v.innerHTML=html;
}
function eventCards(arr){return arr.map((e,i)=>`<div class="card eventcard"><div class="eventart ${i%3===1?'orange':i%3===2?'purple':''}"><span class="pill" style="background:#ffffffdd;color:#263c47">${e.category}</span></div><div class="eventbody"><span class="muted" style="font-size:11px">${e.date}</span><h3>${e.name}</h3><p class="muted">⌖ ${e.venue}</p><div class="eventfoot"><span>${badge(e.status)}</span>${btn(e.status==='Published'?'View event':'Edit event',`openEvent('${e.name}')`)}</div></div></div>`).join('')}
function filterEvents(){const q=document.getElementById('eventSearch').value.toLowerCase(),f=document.getElementById('eventFilter').value;document.getElementById('eventCards').innerHTML=eventCards(state.events.filter(e=>e.name.toLowerCase().includes(q)&&(f==='All'||e.status===f)))}
function createEvent(){openModal('Create an event',`<div class="eyebrow">EVENT SETUP · STEP 1 OF 3</div><p class="muted">Start with the essential details. You can add tickets, venue and schedule next.</p><form onsubmit="saveEvent(event)"><div class="field"><label>Event title *</label><input name="name" required minlength="5" maxlength="100" placeholder="e.g. Innovation Summit 2026"></div><div class="formgrid"><div class="field"><label>Category *</label><select name="category"><option>Seminar</option><option>Workshop</option><option>Conference</option><option>Cultural</option><option>Sports</option><option>Wedding</option><option>Other</option></select></div><div class="field"><label>Capacity *</label><input name="capacity" type="number" min="1" max="100000" value="100" required></div><div class="field"><label>Start date *</label><input name="date" type="date" required></div><div class="field"><label>Ticket price (BDT)</label><input name="price" type="number" min="0" value="0"></div><div class="field span2"><label>Venue</label><select name="venue"><option>Main Auditorium</option><option>Seminar Room</option><option>Open Courtyard</option><option>Online event</option></select></div><div class="field span2"><label>Description</label><textarea name="description" maxlength="5000" placeholder="Tell participants what to expect…"></textarea></div></div><div class="actions" style="justify-content:flex-end">${btn('Cancel','closeModal()') }<button class="btn primary" type="submit">Save draft</button></div></form>`)}
function saveEvent(e){e.preventDefault();const f=new FormData(e.target);state.events.push({name:f.get('name'),category:f.get('category'),date:new Date(f.get('date')+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),venue:f.get('venue'),status:'Draft',capacity:+f.get('capacity'),registered:0,price:+f.get('price')});closeModal();go('events');toast('Event saved as draft')}
function openEvent(name){const e=state.events.find(x=>x.name===name);openModal(name,`<span class="pill">${e.category}</span><p class="muted">${e.date} · ${e.venue}</p><p>${e.registered} registered of ${e.capacity} seats.</p><p>Ticket price: ৳${e.price}</p><div class="actions">${btn('Edit details',"toast('Edit event form opened')")}${btn('Publish event',`publishEvent('${name}')`,'primary')}</div>`)}
function publishEvent(n){const e=state.events.find(x=>x.name===n);e.status='Published';closeModal();render();toast('Event published')}
function addGuest(){openModal('Add guest',`<form onsubmit="saveGuest(event)"><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Ticket type</label><select name="ticket"><option>General</option><option>Student</option><option>Speaker</option></select></div><div class="actions" style="justify-content:flex-end"><button class="btn primary">Add guest</button></div></form>`)}
function saveGuest(e){e.preventDefault();const f=new FormData(e.target);state.registrations.unshift([f.get('name'),f.get('ticket'),'Pending','Just now']);closeModal();render();toast('Guest added to the list')}
function addSession(){openModal('Add schedule session',`<form onsubmit="saveSession(event)"><div class="field"><label>Session title</label><input name="title" required></div><div class="formgrid"><div class="field"><label>Speaker</label><input name="speaker" required></div><div class="field"><label>Room</label><select name="room"><option>Hall 1</option><option>Hall 2</option><option>Hall 3</option></select></div><div class="field"><label>Start time</label><input name="start" type="time" value="14:00" required></div><div class="field"><label>End time</label><input name="end" type="time" value="15:00" required></div></div><div class="actions" style="justify-content:flex-end"><button class="btn primary">Save session</button></div></form>`)}
function saveSession(e){e.preventDefault();const f=new FormData(e.target);if(f.get('end')<=f.get('start')){toast('End time must be after start time');return}closeModal();toast(`${f.get('title')} added to ${f.get('room')}`)}
function resolveConflict(){document.querySelectorAll('.session.conflict').forEach(x=>x.classList.remove('conflict'));const w=document.getElementById('workshop');if(w)w.innerHTML='<b>Workshop B · Moved</b><small>13:30 – 15:00 · Hall 3</small>';toast('Conflict resolved — Workshop B moved to Hall 3 at 1:30 PM')}
function addVenue(){openModal('Add a venue',`<form onsubmit="event.preventDefault();closeModal();toast('Venue added to the venue directory')"><div class="field"><label>Venue name</label><input required placeholder="Venue name"></div><div class="formgrid"><div class="field"><label>Capacity</label><input type="number" min="1" required></div><div class="field"><label>Price per day (BDT)</label><input type="number" min="0" required></div></div><div class="field"><label>Facilities</label><input placeholder="Projector, AC, sound system"></div><div class="actions" style="justify-content:flex-end"><button class="btn primary">Save venue</button></div></form>`)}
function addVendor(){openModal('Request a vendor quote',`<form onsubmit="saveVendor(event)"><div class="field"><label>Vendor / business name</label><input name="name" required></div><div class="field"><label>Service</label><select name="service"><option>Catering</option><option>Stage & decor</option><option>Audio & video</option><option>Photography</option><option>Security</option></select></div><div class="field"><label>Estimated budget (BDT)</label><input name="price" type="number" min="0" required></div><div class="actions" style="justify-content:flex-end"><button class="btn primary">Send quote request</button></div></form>`)}
function saveVendor(e){e.preventDefault();const f=new FormData(e.target);state.vendors.push([f.get('name'),f.get('service'),'৳'+Number(f.get('price')).toLocaleString(),'Pending']);closeModal();render();toast('Vendor quote request added')}
function addExpense(){openModal('Record an expense',`<form onsubmit="saveExpense(event)"><div class="field"><label>Expense name</label><input name="name" required></div><div class="field"><label>Amount (BDT)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>Status</label><select name="status"><option>Pending</option><option>Confirmed</option><option>Booked</option></select></div><div class="actions" style="justify-content:flex-end"><button class="btn primary">Save expense</button></div></form>`)}
function saveExpense(e){e.preventDefault();const f=new FormData(e.target);state.expenses.push([f.get('name'),'৳'+Number(f.get('amount')).toLocaleString(),f.get('status')]);closeModal();render();toast('Expense recorded')}
function sendMessage(){const subject=document.getElementById('msgSubject').value,body=document.getElementById('msgBody').value,audience=document.getElementById('audience').value;if(!subject||!body){toast('Add a subject and message first');return}state.announcements.unshift({subject,body,audience});render();toast('Announcement saved in demo')}
function searchCheckin(){const q=document.getElementById('checkQuery').value.trim();if(!q){toast('Enter a name or ticket ID');return}document.getElementById('checkResult').innerHTML=`<div class="alert" style="margin-top:16px;background:#edf6f3;border-color:#cde8df"><div><b>${q.includes('GT-')?'Alex Rahman':q}</b><div class="muted">General admission · Payment confirmed</div></div>${btn('Confirm check-in','confirmCheckin()','primary')}</div>`}
function confirmCheckin(){state.checks++;document.getElementById('checkCount').textContent=state.checks;document.getElementById('checkResult').innerHTML='<p class="positive"><b>✓ Attendee checked in successfully.</b></p>';toast('Check-in recorded')}
function filterTable(input){const q=input.value.toLowerCase();document.querySelectorAll('#regTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function approve(b){b.textContent='Approved';b.disabled=true;b.classList.remove('soft');b.classList.add('');toast('Account approved')}
render();
</script></body></html>
